<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The ?dev cache-buster below applies to the module files, but the page itself is
     cached per URL — so loading ?dev&validate after editing the loader served a stale
     shell with a module missing. This stops that happening again. -->
<meta http-equiv="Cache-Control" content="no-store">
<title>CYBERVANIA</title>
<style>
  html,body{margin:0;padding:0;background:#04050a;overflow:hidden;height:100%;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#7ef2d0;}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;outline:none;}
  #hud{position:fixed;left:10px;top:10px;font-size:11px;line-height:1.6;white-space:pre;
    color:#8fd8c8;text-shadow:0 0 6px rgba(0,0,0,.9);pointer-events:none;z-index:5;
    background:rgba(3,7,10,.45);padding:8px 10px;border:1px solid rgba(77,227,255,.18);}
  #help{position:fixed;right:10px;top:10px;font-size:11px;line-height:1.7;text-align:right;
    color:#4d6484;pointer-events:none;z-index:5;}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:#04050a;z-index:20;}
  #boot h1{font-size:12px;letter-spacing:.6em;color:#9df;font-weight:400;text-indent:.6em;}
  #err{position:fixed;inset:0;padding:40px;background:#0a0406;color:#ff7a90;font-size:12px;
    white-space:pre-wrap;display:none;z-index:40;overflow:auto;}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud"></div>
<div id="help">
  A / D  or  ← →   move<br>
  SPACE   jump (hold = higher, twice = double)<br>
  SHIFT   dash &nbsp;&nbsp; J / Z  attack &nbsp;&nbsp; E  advance text<br>
  <br>
  P  pixelation on/off &nbsp; O  palette snap<br>
  B  bloom &nbsp; L  scanlines &nbsp; R  resolution
</div>
<div id="boot"><h1>CYBERVANIA</h1><div id="bmsg" style="font-size:10px;color:#2f5f70">BUILDING WORLD</div></div>
<div id="err"></div>

<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = 'CYBERVANIA — FAULT\n\n' + (e.message || '') + '\n\n' +
    (e.filename || '') + ':' + (e.lineno || '') + '\n\n' +
    ((e.error && e.error.stack) || '');
  var b = document.getElementById('boot'); if (b) b.style.display = 'none';
});
</script>

<!-- three.js r128, vendored locally as a UMD build so this page still opens from file:// -->
<script src="vendor/three.min.js"></script>
<script>
/* Load engine modules in order. Opening the page with ?dev appends a cache-buster so
   edits show up on a plain reload; without it the browser cache is used normally. */
(function () {
  var BUST = /[?&](dev|nocache)\b/.test(location.search) ? '?t=' + Date.now() : '';
  var FILES = [
    'proto/textures.js', 'proto/lights.js', 'proto/fx.js', 'proto/kit.js', 'proto/authored.js',
    'proto/enemies.js', 'proto/game.js', 'proto/regions/undercity.js',
    'proto/world.js', 'proto/player.js', 'proto/postfx.js', 'proto/validate.js', 'proto/editor.js',
    'proto/main.js'
  ];
  var i = 0;
  (function next() {
    if (i >= FILES.length) { window.__protoLoaded = true; return start(); }
    var s = document.createElement('script');
    s.src = FILES[i] + BUST;
    s.onload = function () { i++; next(); };
    s.onerror = function () {
      var e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = 'Failed to load ' + FILES[i];
    };
    document.head.appendChild(s);
  })();

  function start() {
    if (!window.THREE) {
      var e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = 'three.js failed to load from vendor/three.min.js';
      return;
    }
    var canvas = document.getElementById('c');
    PROTO.boot(canvas);
    document.getElementById('boot').style.display = 'none';
    canvas.focus();
    PROTO.loop();
  }
})();
</script>

</body>
</html>
